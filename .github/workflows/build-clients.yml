name: Build Desktop Clients

# 三种系统分别用各自的原生 runner 打包：
# PyInstaller 不能交叉编译，Windows/Mac/Linux 的客户端必须在对应系统上构建。
#
# 触发方式：
#   1. 打标签： git tag v1.0.0 && git push origin v1.0.0   → 产出 Release
#   2. 手动：   Actions 页面点 "Run workflow"               → 产出 Artifacts
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "如果当前是 tag 触发，是否创建 Release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "desktop.py"
      - "requirements.txt"
      - ".github/workflows/build-clients.yml"

permissions:
  contents: write

# 全局强制 UTF-8：
# Windows runner 的控制台默认是 cp1252，Python 打印中文会抛 UnicodeEncodeError
# 并以退出码 1 结束（日志几乎是空的）。脚本内部也各自做了兜底，这里是第二道保险。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false          # 一个平台失败不影响其它平台出包
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: nnkBiliDown-Windows-x64
          - os: macos-13           # Intel
            label: macOS x64
            artifact: nnkBiliDown-macOS-x64
          - os: macos-14           # Apple Silicon (M 系列)
            label: macOS arm64
            artifact: nnkBiliDown-macOS-arm64
          - os: ubuntu-22.04       # glibc 2.35 基线，兼容较广
            label: Linux x64
            artifact: nnkBiliDown-Linux-x64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # pywebview 在 Linux 上依赖 GTK + WebKit2GTK
      - name: 安装 Linux 图形依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgtk-3-0 libwebkit2gtk-4.1-0 libgirepository1.0-dev \
            patchelf

      - name: 升级 pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: 安装运行依赖
        run: python -m pip install -r requirements.txt

      # Linux 的 ffmpeg 构建需要匹配 CI 的 glibc；BtbN 的 linux64 静态构建可满足
      - name: 下载并内置 ffmpeg
        run: python packaging/fetch_ffmpeg.py

      - name: 检查内置 ffmpeg
        run: python packaging/fetch_ffmpeg.py --check

      # 产物布局定位逻辑的自测：macOS .app 的资源位置与 Windows/Linux 不同，
      # 这个脚本用合成目录树验证定位逻辑，避免再次出现"打包成功但校验报缺文件"
      - name: 校验产物定位逻辑
        run: python packaging/test_output_layout.py

      # macOS 的 .icns 由 build.py 用系统 sips/iconutil 自动生成
      - name: 打包客户端
        run: python packaging/build.py --build-frontend --ci

      - name: 列出产物
        shell: bash
        run: ls -lhR dist/ | head -60

      # 构建失败时把关键诊断信息打出来，避免只看到一句 exit code 1
      - name: 失败诊断
        if: failure()
        shell: bash
        run: |
          echo "===== python / pip ====="
          python -V || true
          python -m pip -V || true
          python -m pip config list || true
          echo "===== 内置 ffmpeg ====="
          ls -lh tools/ffmpeg || true
          echo "===== 前端产物 ====="
          ls -lh frontend/dist || true
          echo "===== dist（若已生成）====="
          ls -lhR dist/ 2>/dev/null | head -60 || echo "dist 不存在"
          echo "===== PyInstaller warn 文件 ====="
          find build -name 'warn-*.txt' -exec sh -c 'echo "--- {}"; tail -40 "{}"' \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总文件
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## nnkBiliDown 桌面客户端

            解压即用，已内置 ffmpeg，无需安装 Python / Node / ffmpeg。

            | 系统 | 文件 | 使用方式 |
            | --- | --- | --- |
            | Windows 10/11 x64 | `nnkBiliDown-Windows-x64.zip` | 解压后双击 `nnkBiliDown.exe` |
            | macOS Apple Silicon | `nnkBiliDown-macOS-arm64.zip` | 解压后双击 `nnkBiliDown.app`（首次需右键 → 打开） |
            | macOS Intel | `nnkBiliDown-macOS-x64.zip` | 同上 |
            | Linux x64 | `nnkBiliDown-Linux-x64.tar.gz` | `tar -xzf` 后运行 `./nnkBiliDown` |

            > macOS 版本未做代码签名与公证，首次打开请**右键 → 打开**，
            > 或执行 `xattr -dr com.apple.quarantine nnkBiliDown.app`。
            >
            > Linux 版本需要 WebKit2GTK（多数桌面发行版已自带）：
            > `sudo apt install python3-gi gir1.2-webkit2-4.1`
